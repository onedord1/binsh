name: Build and Release Snap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build backend with embedded frontend
        working-directory: backend
        run: |
          mkdir -p cmd/systask/static
          cp -r ../frontend/dist/* cmd/systask/static/
          CGO_ENABLED=0 go build -ldflags="-s -w" -o ../dist/binsh ./cmd/systask

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@v4
        with:
          name: snap
          path: .

      - name: Find snap file
        id: find-snap
        run: echo "snap=$(ls *.snap)" >> $GITHUB_OUTPUT

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN }}
        with:
          snap: ${{ steps.find-snap.outputs.snap }}
          release: beta
