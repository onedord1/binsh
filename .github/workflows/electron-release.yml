name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build backend with embedded frontend
        working-directory: backend
        run: |
          mkdir -p cmd/systask/static
          cp -r ../frontend/dist/* cmd/systask/static/
          CGO_ENABLED=0 go build -ldflags="-s -w" -o ../dist/binsh ./cmd/systask
          chmod +x ../dist/binsh

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Install snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Build Electron app (Linux)
        working-directory: electron
        run: |
          npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            electron/release/*.deb
            electron/release/*.rpm
            electron/release/*.AppImage
            electron/release/*.snap

  publish-snap:
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: ./release

      - name: List files
        run: ls -la ./release/

      - name: Find snap file
        id: find-snap
        run: echo "snap=$(ls ./release/*.snap 2>/dev/null | head -1)" >> $GITHUB_OUTPUT

      - name: Publish to Snap Store
        if: steps.find-snap.outputs.snap != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN }}
        run: |
          sudo snap install --classic snapcraft
          snapcraft upload ${{ steps.find-snap.outputs.snap }} --release beta

  github-release:
    needs: build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./release/*.deb
            ./release/*.rpm
            ./release/*.AppImage
            ./release/*.snap
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
