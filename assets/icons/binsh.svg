<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f1d30"/>
    </linearGradient>
    <linearGradient id="hashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- Hash symbol # -->
  <g fill="url(#hashGrad)">
    <!-- Vertical bars -->
    <rect x="175" y="120" width="40" height="272" rx="8" transform="rotate(-12 195 256)"/>
    <rect x="297" y="120" width="40" height="272" rx="8" transform="rotate(-12 317 256)"/>
    
    <!-- Horizontal bars -->
    <rect x="115" y="185" width="282" height="40" rx="8"/>
    <rect x="115" y="287" width="282" height="40" rx="8"/>
  </g>
</svg>
