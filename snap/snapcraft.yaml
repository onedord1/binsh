name: binsh
version: '1.0.0-beta'
summary: Modern SSH Client & Server Management Platform
description: |
  binsh is a powerful, feature-rich SSH client designed for DevOps engineers,
  system administrators, and developers who manage multiple servers.

  Features:
  - Multi-server management with groups and tags
  - Secure credential storage with AES-256 vault encryption
  - SFTP file manager with dual-pane interface
  - Cloud provider integration (AWS, GCP, Azure, DigitalOcean, Linode)
  - Port forwarding management (local, remote, dynamic)
  - Command snippets library
  - Real-time system metrics
  - Import/Export hosts (SSH config, JSON, CSV)
  - Terminal with 15+ color themes

grade: stable
confinement: strict
base: core22
architectures:
  - build-on: amd64

apps:
  binsh:
    command: bin/binsh
    desktop: usr/share/applications/binsh.desktop
    plugs:
      - network
      - network-bind
      - home
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - browser-support
    environment:
      HOME: $SNAP_USER_DATA
      XDG_CONFIG_HOME: $SNAP_USER_DATA/.config

parts:
  binsh:
    plugin: dump
    source: dist/
    source-type: local
    organize:
      binsh: bin/binsh
    stage:
      - bin/binsh

  desktop:
    plugin: dump
    source: snap/gui
    organize:
      binsh.desktop: usr/share/applications/binsh.desktop

  icons:
    plugin: dump
    source: assets/icons
    organize:
      binsh-256.png: usr/share/icons/hicolor/256x256/apps/binsh.png
      binsh-128.png: usr/share/icons/hicolor/128x128/apps/binsh.png
      binsh-64.png: usr/share/icons/hicolor/64x64/apps/binsh.png
      binsh-48.png: usr/share/icons/hicolor/48x48/apps/binsh.png
      binsh-32.png: usr/share/icons/hicolor/32x32/apps/binsh.png
      binsh-16.png: usr/share/icons/hicolor/16x16/apps/binsh.png
      binsh.svg: usr/share/icons/hicolor/scalable/apps/binsh.svg
